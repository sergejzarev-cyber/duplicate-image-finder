<!doctype html>

    <script>
      // Ранний выбор <html lang>: сохранённый выбор → язык браузера → английский.
      // Зеркало detectInitialLang() из src/i18n.tsx, чтобы правильный lang стоял до загрузки React.
      try {
        var s = localStorage.getItem("dupsweep.lang");
        var ok = s === "ru" || s === "de" || s === "en";
        if (!ok) {
          var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
          for (var i = 0; i < ls.length; i++) {
            var b = String(ls[i]).split("-")[0].toLowerCase();
            if (b === "ru" || b === "de" || b === "en") { s = b; ok = true; break; }
          }
        }
        document.documentElement.lang = ok ? s : "en";
      } catch (e) { document.documentElement.lang = "en"; }
    </script>
